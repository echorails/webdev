<div class="container">
  <h1>Товары с Kaspi.kz</h1>

  <div *ngIf="products.length === 0">No products in this category</div> 

  <div class="grid">
    <app-product-item
      *ngFor="let product of products"
      [product]="product"
      (delete)="onDelete($event)"> 
    </app-product-item>
  </div>
</div>
